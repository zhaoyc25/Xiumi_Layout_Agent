<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导入本地文章</title>
  <style>
    body { width: 380px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #222; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input, textarea, select { box-sizing: border-box; width: 100%; margin-top: 4px; padding: 7px; border: 1px solid #ccc; border-radius: 4px; }
    textarea { height: 58px; resize: vertical; }
    .hint { color: #666; font-size: 12px; }
    .warning { color: #a34b00; }
    button { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 4px; color: white; background: #07c160; cursor: pointer; }
    button:disabled { cursor: not-allowed; background: #aaa; }
    #status { min-height: 21px; margin: 10px 0 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>导入本地文章</h1>
  <p class="hint">先登录微信公众平台，并打开一个“新建图文”编辑页。导入后请人工检查、保存和手机预览。</p>

  <label for="target">目标编辑页</label>
  <select id="target"><option value="">正在查找……</option></select>

  <label for="file">文章文件（.html / .htm / .json）</label>
  <input id="file" type="file" accept=".html,.htm,.json,text/html,application/json">
  <p class="hint">JSON 字段：title、desc、html、wxAuthor、wxLink。</p>

  <label for="title">标题</label>
  <input id="title" maxlength="64">
  <label for="desc">摘要</label>
  <textarea id="desc" maxlength="120"></textarea>
  <label for="author">作者（可选）</label>
  <input id="author">
  <label for="link">原文链接（可选）</label>
  <input id="link" type="url" placeholder="https://">

  <button id="import" disabled>导入到微信编辑器</button>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
